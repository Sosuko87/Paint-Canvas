<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Paint Canvasーペイントキャンバス</title>
    <meta name="description" content="Paint Canvas（ペイントキャンバス）では、Youtubeなどのサムネイルを作成できます。ダウンロード時なども完全無料！お好きなようにお使いください。">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/logo.png">
</head>
<body>
    <div class="banner">
        Paint Canvas
        <img src="image/logo.png" alt="Paint Canvas Logo" width="40px" height="40px" style="position: relative; left: 10px; top: 5px;">
        <span id="japanese_title">ペイントキャンバス</span>
        <a href="https://scratch.mit.edu/" class="btn">ダウンロード</a>
    </div>
    <div class="scrollbox">
        <div class="font">使用フォント：
            <select class="font-dropdown" name="Font">
                <option value="Noto Sans JP">Noto Sans JP</option>
                <option value="M PLUS Rounded 1c">M PLUS Rounded 1c</option>
                <option value="Noto Serif Japanese">Noto Serif Japanese</option>
            </select>
            
            <form action="index.html" method="post" enctype="multipart/form-data" >
                <input type="file" name="test" accept=".ttf, .woff, .woff2, .otf">
            </form>
            <hr style="border: 1px solid #ff8800; margin: 13px 0; border-radius: 10px;">
            <div class="mojieffect">文字エフェクト：
                <p style="margin-top: 10px; margin-bottom: 0; display: block;">太さ：</p><input type="range" min="0" max="5" value="50" step="1" display="inline">
            </div>
        </div>
    </div>
</body>
